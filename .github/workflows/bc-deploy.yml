name: BC Deploy

# Despliega UN Business Context (BC) construido localmente por ADN con el
# BPB, directo a Linux Trixie (producción) -- SIN pasar por el repo
# compartido metadata_stack-. Disparado por `mix motor.publicar <catalogo>`
# (nunca a mano desde la UI de Actions -- necesita el bundle en base64 que
# arma ese task).
#
# Cómo evita tocar el repo compartido: el checkout de acá abajo es de
# `main` tal cual está, el bundle del BC se EXTRAE ENCIMA solo en el
# working directory efímero de ESTE runner -- nunca hay git add/commit/push
# en ningún paso. Cuando el job termina, el runner se destruye y esos
# archivos desaparecen con él; origin/main nunca se entera de que este BC
# existió.
on:
  workflow_dispatch:
    inputs:
      catalogo:
        description: "Catálogo(s) raíz a desplegar (uno o varios separados por '-') — solo para identificar el run/tag, el paquete completo ya viene armado en el bundle"
        required: true
      bundle_b64:
        description: "Bundle .tar.gz (schema + migraciones + meta/motor.json + reglas) en base64, armado por mix motor.publicar"
        required: true

env:
  ELIXIR_VERSION: "1.18.4"
  OTP_VERSION: "28.0.4"
  # Sin esto, cualquier `mix` (incluido `mix local.rebar` de setup-beam)
  # corre en :dev por defecto -- y config/dev.exs ya no existe en el
  # checkout de CI (gitignorado, config local por máquina), así que
  # config/config.exs revienta al intentar importarlo. ci.yml no lo sufre
  # porque ya fija MIX_ENV: test en su job "validate".
  MIX_ENV: prod

jobs:
  deploy-bc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Extraer el bundle del BC sobre el checkout del BPB
        run: |
          echo "${{ inputs.bundle_b64 }}" | base64 -d > /tmp/bc-bundle.tar.gz
          tar xzf /tmp/bc-bundle.tar.gz
          rm /tmp/bc-bundle.tar.gz
          echo "--- archivos del bundle ya extraidos ---"
          git status --porcelain

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      # Compila (con el .ex del bundle ya en su lugar) ANTES de armar la
      # imagen -- si el BC no compila, el job falla acá, nunca llega a
      # publicar ni desplegar nada roto.
      - name: Instalar dependencias y compilar
        run: |
          mix deps.get
          mix compile --warning-as-errors

      - name: Nombre de imagen para ghcr.io (minúsculas, sin separador final)
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          repo="${repo%[-._]}"
          echo "IMAGE_NAME=$repo" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mismo Dockerfile de siempre -- el bundle ya extraído en el checkout
      # es justo lo que "COPY lib lib" / "COPY priv priv" van a empaquetar.
      # Tag "latest" se actualiza igual que un deploy normal del BPB (el
      # BC pasa a ser parte de la imagen corriendo); el tag con el nombre
      # del catálogo es para poder identificar/rollear a esta build puntual.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:bc-${{ inputs.catalogo }}-${{ github.run_number }}

      # k3s, no Docker Swarm -- ver el comentario largo en ci.yml (mismo
      # bug, mismo fix, 2026-08-28): DEPLOY_HOST apunta al servidor Hetzner
      # ya migrado a k3s, este workflow seguía con comandos viejos de
      # Swarm.
      - name: Actualizar metadata-stack-app en k3s y migrar
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            sudo k3s kubectl set image deployment/metadata-stack-app app=ghcr.io/prettycore-13/metadata_stack:latest -n metadata-stack
            sudo k3s kubectl rollout restart deployment/metadata-stack-app -n metadata-stack

            echo "Esperando a que el rollout converja..."
            sudo k3s kubectl rollout status deployment/metadata-stack-app -n metadata-stack --timeout=120s

            POD=$(sudo k3s kubectl get pod -n metadata-stack -l app=metadata-stack-app -o jsonpath='{.items[0].metadata.name}')
            if [ -z "$POD" ]; then
              echo "No se encontró el pod de metadata-stack-app, no se pudo migrar"
              exit 1
            fi
            # setup = migrate + import_meta (crea el registro en
            # meta_schema_header/detail/estados/transiciones que hace que
            # el motor reconozca la tabla del BC como Business Context
            # real -- sin esto la tabla existe pero la API responde "no
            # encontrado") + sysadmin/empresa inicial si hicieran falta,
            # ver docs/onboarding-nuevo-sistema.md.
            sudo k3s kubectl exec -n metadata-stack "$POD" -- /app/bin/setup
