name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ELIXIR_VERSION: "1.18.4"
  OTP_VERSION: "28.0.4"

jobs:
  # Reproduce el mismo ciclo que se corre a mano en el devcontainer:
  # migrar desde una base vacia, importar la metadata versionada, generar
  # todos los catalogos y compilar. Si el historial de migraciones tiene un
  # migration roto (como el caso de pty_motos) o la metadata quedo
  # desincronizada del codigo generado, este job falla ANTES de llegar a
  # build-image.
  validate:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metadata_app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Instalar dependencias
        run: mix deps.get

      - name: Crear base de test
        run: mix ecto.create

      - name: Migrar desde base vacia
        run: mix ecto.migrate

      - name: Importar metadata versionada (Business Contexts)
        run: mix meta.import

      - name: Generar todos los catalogos desde metadata
        run: mix gen.catalogos

      - name: Verificar que no haya quedado nada sin commitear
        run: |
          git status --porcelain lib/metadata_app/meta_business_process/catalogos priv/repo/migrations priv/repo/catalogos > /tmp/drift.txt
          if [ -s /tmp/drift.txt ]; then
            echo "La metadata versionada generó archivos que no están commiteados:"
            cat /tmp/drift.txt
            echo "Corré 'mix gen.catalogos' localmente y commiteá el resultado."
            exit 1
          fi

      - name: Verificar que no queden reglas de negocio en estado stub
        run: |
          if grep -rl "# ESCRIBA SUS REGLAS AQUI" lib/metadata_app/meta_business_process/reglas/ > /tmp/stubs.txt 2>/dev/null; then
            echo "Hay reglas de negocio sin completar (todavia con el stub de 'mix motor.reglas.andamiar'):"
            cat /tmp/stubs.txt
            echo "Completa la logica de negocio antes de publicar, o desenganchala si no hace falta."
            exit 1
          fi

      - name: Compilar sin warnings
        run: mix compile --warning-as-errors

      # --exclude external_http: tests que llaman httpbin.org de verdad, a
      # propósito (sin mocks, ver el moduledoc de integraciones_reglas_post_test.exs)
      # -- valioso correrlos a mano, pero un servicio de terceros caído
      # (encontrado real, 2026-08-16: 3 corridas seguidas bloqueadas por
      # httpbin.org respondiendo 500/timeout) no puede bloquear el deploy de
      # un cambio que no tiene nada que ver. Siguen andando igual en
      # `mix test` local sin este flag.
      - name: Test
        run: mix test --exclude external_http

  # Solo corre si "validate" pasó. Arma la imagen de producción con el mismo
  # Dockerfile que se probó a mano (build stage con compilador, runtime sin
  # el) y la publica en GitHub Container Registry.
  build-image:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Un deploy normal del BPB, sin esto, reconstruye la imagen "limpia"
      # -- sin ningún BC publicado con motor.publicar/el wizard de BC List
      # adentro, porque pty_* nunca vive en el checkout de main (ver
      # docs/roadmap.md, CD automático). Cada catálogo publicado tiene su
      # bundle guardado como asset en un GitHub Release con tag "bc-<
      # catálogo>" (MetaPublicador.persistir_bundle/2) -- el Release mismo
      # ES el manifest de "esto debe quedar siempre vivo", no hace falta
      # ningún archivo de texto aparte. Acá se restauran todos antes de
      # armar la imagen, así este job nunca "olvida" un BC ya publicado.
      - name: Restaurar BCs publicados (bc-*) para que este deploy no los olvide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAGS=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[] | select(.tagName | startswith("bc-")) | .tagName')

          if [ -z "$TAGS" ]; then
            echo "Ningún BC publicado todavía -- nada que restaurar."
          else
            for tag in $TAGS; do
              echo "== restaurando $tag =="
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.tar.gz' --output "/tmp/$tag.tar.gz" --clobber
              tar xzf "/tmp/$tag.tar.gz"
              rm "/tmp/$tag.tar.gz"
            done
            echo "--- BCs restaurados sobre el checkout ---"
            git status --porcelain
          fi

      - name: Nombre de imagen para ghcr.io (minúsculas, sin separador final)
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          repo="${repo%[-._]}"
          echo "IMAGE_NAME=$repo" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # Solo corre si "build-image" publicó la imagen nueva. Actualiza el
  # Deployment en k3s y corre las migraciones — el mismo ciclo manual
  # documentado en docs/ci-cd-deploy.md, ahora automático. Requiere 3
  # secrets en el repo (Settings -> Secrets and variables -> Actions):
  # DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (privada, ed25519) — ninguno
  # vive acá ni en ningún archivo versionado, el repo es público.
  #
  # k3s, no Docker Swarm -- DEPLOY_HOST pasó a apuntar al mismo servidor
  # Hetzner que se migró a k3s (2026-08-26/27, ver
  # MetadataApp.Ssh/mix motor.desplegar), pero este workflow seguía con
  # los comandos viejos de Swarm -- rompía la migración automática en
  # CADA push a main desde entonces sin que nadie lo notara (encontrado
  # real 2026-08-28, "Actualizar ... en Docker Swarm" fallando en TODAS
  # las corridas recientes). Namespace/deployment fijos
  # (metadata-stack/metadata-stack-app), mismos nombres que dejó esa
  # migración. Asume que DEPLOY_USER tiene NOPASSWD sudo para
  # /usr/local/bin/k3s (ya configurado para "elixir" en ese servidor).
  deploy:
    needs: build-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Actualizar metadata-stack-app en k3s y migrar
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            sudo k3s kubectl set image deployment/metadata-stack-app app=ghcr.io/prettycore-13/metadata_stack:latest -n metadata-stack
            sudo k3s kubectl rollout restart deployment/metadata-stack-app -n metadata-stack

            echo "Esperando a que el rollout converja..."
            sudo k3s kubectl rollout status deployment/metadata-stack-app -n metadata-stack --timeout=120s

            # items[0] agarraba el PRIMERO que devolviera la API, sin ordenar
            # -- durante la ventana en que el pod viejo todavía está
            # Terminating (su `status.phase` sigue en "Running" hasta que
            # Kubernetes lo borra del todo, no hay field-selector que lo
            # excluya de forma confiable) podía ser el viejo en vez del
            # nuevo, y el exec fallaba con "container not found" aunque el
            # rollout ya hubiera convergido (encontrado real 2026-09-03).
            # Ordenar por creationTimestamp y tomar el último (--sort-by
            # deja el jsonpath en orden ascendente, awk agarra el final)
            # siempre da el pod recién creado por este rollout.
            POD=$(sudo k3s kubectl get pod -n metadata-stack -l app=metadata-stack-app --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[*].metadata.name}' | awk '{print $NF}')
            if [ -z "$POD" ]; then
              echo "No se encontró el pod de metadata-stack-app, no se pudo migrar"
              exit 1
            fi
            sudo k3s kubectl exec -n metadata-stack "$POD" -- /app/bin/setup
